# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.
#
# Phase 3 note: Home, Research, Projects, Publications, Team, Calls, News
# and Contact all have real content/pages now.

main:
  - name: Home
    url: '/'
    weight: 10
  - name: Research
    url: '/research/'
    weight: 20
  - name: Projects
    url: '/projects/'
    weight: 25
  - name: Publications
    url: '/publications/'
    weight: 27
  - name: Team
    url: '/people/'
    weight: 28
  - name: Calls
    url: '/calls/'
    weight: 29
  - name: News
    url: '/news/'
    weight: 30
  - name: Contact
    url: '/contact/'
    weight: 35
