# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.
#
# Phase 1 note: only Home has real content so far. Research / Team / Publications / News /
# Contact will be added back here as each section is rebuilt with real Juanes Lab content
# in the next phases (see project notes).

main:
